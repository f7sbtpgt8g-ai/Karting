name: Tests, then promote to the deploy branch

# Vercel and Railway both build the repo's default branch, while development
# happens on a feature branch. That gap meant anything pushed here was
# invisible to both until someone merged by hand -- which repeatedly turned
# "run this command on the worker" into a round trip through a pull request.
#
# So: run the suite on every push to the working branch, and merge into the
# deploy branch only if it passes. A red build stops at the tests and the
# deploy branch is left alone.
#
# This deliberately trades review for speed, which is the right trade only
# while one person is working on this migration. To go back to reviewing
# each change, delete the `promote` job below (or the whole file) and merge
# by pull request again.

on:
  push:
    branches: ["feature/analysis-extraction"]
  workflow_dispatch:

env:
  WORKING_BRANCH: feature/analysis-extraction
  DEPLOY_BRANCH: claude/new-session-yilc1w

# One promotion at a time: two pushes in quick succession would otherwise
# race to merge into the same branch.
concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    name: Python suite
    runs-on: ubuntu-latest

    # The RLS, worker, analysis-store and backfill suites all apply the real
    # migrations to a real Postgres -- they skip themselves when none is
    # reachable, so without this service they would pass by not running.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The migration-applying fixtures shell out to psql.
      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - run: pip install -r requirements.txt

      # Those suites skip themselves when Postgres is unreachable, and a
      # skip is silent -- a green run that quietly tested no policies and no
      # migrations is worse than a red one. This is their exact skip
      # predicate, asserted before the suite runs.
      - name: Confirm the database-backed tests will not skip
        run: |
          psql "$RLS_TEST_ADMIN_DSN" -c 'select version()'
          python -c "import os,psycopg2;psycopg2.connect(os.environ['RLS_TEST_ADMIN_DSN'],connect_timeout=5).close();print('Postgres reachable')"
        env:
          RLS_TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres

      - name: pytest
        run: python -m pytest -q -p no:randomly
        env:
          RLS_TEST_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres

  web:
    name: Next.js typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

      # The sector partitioning is real logic with real failure modes (a
      # split landing mid-corner, an empty sector reading as a 0.000 split),
      # and none of it is exercised by a typecheck or a build.
      - run: npm test

      # Placeholders: these are only read at build time to inline into the
      # bundle, and nothing in the build talks to Supabase. Using the real
      # values here would put them in logs for no benefit.
      - run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  promote:
    name: Merge into the deploy branch
    needs: [python, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout "$DEPLOY_BRANCH"
          git pull --ff-only origin "$DEPLOY_BRANCH"

          if git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "$DEPLOY_BRANCH already contains $GITHUB_SHA -- nothing to do."
            exit 0
          fi

          # A merge commit rather than a rebase: the deploy branch has its
          # own history from earlier pull requests, and rewriting it would
          # invalidate every checkout of it.
          git merge "$GITHUB_SHA" -m "Promote ${GITHUB_SHA:0:7} (tests green) to $DEPLOY_BRANCH"

          git push origin "$DEPLOY_BRANCH"
          echo "Promoted $GITHUB_SHA -> $DEPLOY_BRANCH; Vercel and Railway will rebuild."
